name: IKEv2 Auto DNS Updater

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write # دسترسی ذخیره فایل در ریپازیتوری

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Checker Script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python checker.py

      - name: Commit and Push Healthy IPs File
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add healthy_ips.txt
          git commit -m "Auto update healthy_ips.txt" || exit 0
          git push
