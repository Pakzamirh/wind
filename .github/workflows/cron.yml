name: IKEv2 Separate Domain Scanner

on:
  schedule:
    - cron: '*/30 * * * *'  # اجرای خودکار هر ۳۰ دقیقه
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Domain Checker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: python checker.py

      - name: Commit and Push Separate Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add healthy_ips.txt results/
          git commit -m "Auto update separate domain IP files" || exit 0
          git pull --rebase
          git push
